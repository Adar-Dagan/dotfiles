# Neovim recommended settings (:checkhealth vim.health)

# Faster escape sequence detection (avoids delay on <Esc> in nvim)
set-option -sg escape-time 10

# Let nvim know when the terminal gains/loses focus ('autoread', etc.)
set-option -g focus-events on

# True color support. 'foot' is the outer $TERM (outside tmux).
set-option -g default-terminal "tmux-256color"
set-option -a terminal-features 'foot:RGB'

# Undercurl / colored underlines (nvim diagnostics)
set-option -a terminal-features 'foot:usstyle'
